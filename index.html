<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta Insana</title>

    <link rel="stylesheet" href="style.css">

    <link rel="shortcut icon" href="./img/cupcake.jpg" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">


</head>
    <body>
        <main>
        
        <section id="area-roleta">

            <div class="intro">
                <h1>ROLETA DE JOGOS</h1>

                <p>
                    Criado para um amigo que me pediu uma recomendação de jogos de terror para jogar.
                </p>
            </div>

            <div class="window">

                <div class="roulette">
                </div>

            </div>

            <div class="button">

                <button id="btn">RODAR</button>

            </div>
        </section>

        <section class="resultado">

            <div class="resultado-titulo">
                <span>E SEU JOGO É...</span>
            </div>

            <div class="res-image">

                <button class="prev" id="prev">‹</button>

                <img id="res-promo"  alt="Imagem de Destaque">

                
                <button class="next" id="next">›</button>
            </div>

            <div class="ind" id="ind"></div>

            <div class="res-infos">
                <h1 id="res-name"></h1>

                <h3 id="res-desc"></h3>
            </div>

            <div>
                <button id="btn2">ACESSE O JOGO</button>
            </div>

        </section>
            
        </main>

        <div id="transic"></div>

        <script src="script.js"></script>

    </body>
    
</html>
